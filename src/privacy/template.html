<main id="main">
  <section class="legal-hero fluid-section" aria-labelledby="legal-title">
    <div class="legal-hero-copy reveal"><p class="eyebrow">{{heroEyebrow}}</p><h1 id="legal-title">{{heroHeading}}<em>{{heroAccent}}</em></h1><p class="legal-intro">{{heroDescription}}</p><p class="legal-updated">{{heroUpdated}}</p></div>
    <div class="fluid-orbit legal-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
  </section>
  <section class="legal-body fluid-section" aria-label="Privacy policy"><span class="fluid-grid" aria-hidden="true"></span>
    <nav class="legal-index" aria-label="Jump to a section">{{index}}</nav>
    <div class="legal-articles">{{articles}}</div>
  </section>
  <section class="legal-closing" aria-labelledby="legal-closing-title">
    <div class="legal-closing-copy reveal"><h2 id="legal-closing-title">{{closingHeading}}</h2><p>{{closingDescription}}</p><div class="legal-closing-actions"><a class="pill" href="{{contactHref}}">{{closingButton}}<span class="button-arrow" aria-hidden="true">→</span></a><button type="button" class="cookie-ghost" data-consent-open>Cookie settings</button></div></div>
  </section>
</main>
